name: Deploy Wasm to Pages

on:
  push:
    branches: [ main, master ] # Je nachdem, wie dein Hauptbranch heißt

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Das ist der wichtige Befehl! Er baut die optimierte Version für den Browser.
      - name: Build Wasm
        run: ./gradlew wasmJsBrowserDistribution

      # Dieser Schritt lädt den fertigen Ordner auf den "gh-pages" Branch hoch
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: composeApp/build/dist/wasmJs/productionExecutable